name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Backend
    - name: Create server .env
      working-directory: ./styles/server
      run: |
        echo "PORT=4000" > .env
        echo "CLIENT_URL=http://localhost:3000" >> .env
        echo "JWT_SECRET=ci_jwt_secret_placeholder" >> .env
        echo "DATABASE_URL=postgresql://user:password@localhost:5432/testdb" >> .env

    - name: Install Backend Dependencies
      working-directory: ./styles/server
      run: npm install

    - name: Run Backend Linter
      working-directory: ./styles/server
      run: npm run lint --if-present

    - name: Run Backend Tests
      working-directory: ./styles/server
      run: npm run test --if-present

    - name: Upload Backend Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: server-test-report
        path: styles/server/reports/server-test-report.xml

    # Frontend
    - name: Create client .env.local
      working-directory: ./styles/client
      run: |
        echo "NEXT_PUBLIC_API_URL=http://localhost:4000/api" > .env.local

    - name: Install Frontend Dependencies
      working-directory: ./styles/client
      run: npm install

    - name: Run Frontend Linter
      working-directory: ./styles/client
      run: npm run lint --if-present

    - name: Run Frontend Tests
      working-directory: ./styles/client
      run: npm run test --if-present

    - name: Upload Frontend Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: client-test-report
        path: styles/client/reports/client-test-report.xml
