name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ECR_BACKEND_REPO: shopsmart-backend
  ECR_FRONTEND_REPO: shopsmart-frontend
  ECS_CLUSTER: shopsmart-cluster
  BACKEND_SERVICE: shopsmart-backend-service
  FRONTEND_SERVICE: shopsmart-frontend-service
  BACKEND_CONTAINER: shopsmart-backend-container
  FRONTEND_CONTAINER: shopsmart-frontend-container

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Backend
      - name: Create server .env
        working-directory: ./styles/server
        run: |
          if [ -n "${{ secrets.APP_ENV }}" ]; then
            printf '%s\n' "${{ secrets.APP_ENV }}" > .env
          else
            echo "PORT=4000" > .env
            echo "CLIENT_URL=http://localhost:3000" >> .env
            echo "JWT_SECRET=ci_jwt_secret_placeholder" >> .env
            echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/testdb" >> .env
          fi

      - name: Install Backend Dependencies
        working-directory: ./styles/server
        run: npm ci || npm install

      - name: Run Backend Linter
        working-directory: ./styles/server
        run: npm run lint --if-present

      - name: Run Backend Tests
        working-directory: ./styles/server
        run: npm run test --if-present

      - name: Upload Backend Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-report
          path: styles/server/reports/server-test-report.xml

      # Frontend
      - name: Create client .env.local
        working-directory: ./styles/client
        run: |
          echo "NEXT_PUBLIC_API_URL=/api" > .env.local

      - name: Install Frontend Dependencies
        working-directory: ./styles/client
        run: npm ci || npm install

      - name: Run Frontend Linter
        working-directory: ./styles/client
        run: npm run lint --if-present

      - name: Run Frontend Tests
        working-directory: ./styles/client
        run: npm run test --if-present

      - name: Upload Frontend Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-report
          path: styles/client/reports/client-test-report.xml

  infrastructure:
    name: Terraform Apply
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure Terraform State Bucket Exists
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if ! aws s3api head-bucket --bucket shopsmart-tfstate-praneeth1116 2>/dev/null; then
            echo "Bucket does not exist. Creating..."
            aws s3 mb s3://shopsmart-tfstate-praneeth1116 --region $AWS_REGION
          else
            echo "Bucket already exists."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Parse APP_ENV into Terraform vars
        run: |
          ENV_CONTENT="${{ secrets.APP_ENV }}"
          DB_URL=$(echo "$ENV_CONTENT" | awk -F= '/^DATABASE_URL=/{print $2}' | head -1)
          JWT=$(echo "$ENV_CONTENT" | awk -F= '/^JWT_SECRET=/{print $2}' | head -1 | tr -d "'\"")
          if [ -z "$DB_URL" ] || [ -z "$JWT" ]; then
            echo "Using defaults for terraform validation."
            DB_URL="postgresql://dummy:dummy@localhost/dummy"
            JWT="dummy_secret"
          fi
          echo "TF_VAR_database_url=$DB_URL" >> $GITHUB_ENV
          echo "TF_VAR_jwt_secret=$JWT" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Import Existing Resources
        working-directory: ./terraform
        run: |
          terraform state show aws_ecr_repository.shopsmart_backend > /dev/null 2>&1 || terraform import aws_ecr_repository.shopsmart_backend shopsmart-backend || true
          terraform state show aws_ecr_repository.shopsmart_frontend > /dev/null 2>&1 || terraform import aws_ecr_repository.shopsmart_frontend shopsmart-frontend || true
          terraform state show aws_ecs_cluster.shopsmart_cluster > /dev/null 2>&1 || terraform import aws_ecs_cluster.shopsmart_cluster shopsmart-cluster || true

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Build & Deploy to ECS
    needs: infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./styles/server
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          echo "ECR_BACKEND_URL=$ECR_REGISTRY/$ECR_BACKEND_REPO" >> $GITHUB_ENV

      - name: Build, tag, and push frontend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./styles/client
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          echo "ECR_FRONTEND_URL=$ECR_REGISTRY/$ECR_FRONTEND_REPO" >> $GITHUB_ENV

      - name: Download Backend Task Definition
        env:
          TASK_DEF_FAMILY: "shopsmart-backend-task"
        run: |
          aws ecs describe-task-definition --task-definition $TASK_DEF_FAMILY --query taskDefinition --output json > backend-task-def.json

      - name: Download Frontend Task Definition
        env:
          TASK_DEF_FAMILY: "shopsmart-frontend-task"
        run: |
          aws ecs describe-task-definition --task-definition $TASK_DEF_FAMILY --query taskDefinition --output json > frontend-task-def.json

      - name: Render Backend Task Definition
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: ${{ env.BACKEND_CONTAINER }}
          image: ${{ env.ECR_BACKEND_URL }}:${{ github.sha }}

      - name: Render Frontend Task Definition
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: ${{ env.FRONTEND_CONTAINER }}
          image: ${{ env.ECR_FRONTEND_URL }}:${{ github.sha }}

      - name: Deploy Backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Deploy Frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
          service: ${{ env.FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
