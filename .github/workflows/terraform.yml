name: Phase 2 - Terraform Provisioning

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform State Bucket Exists
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if ! aws s3api head-bucket --bucket shopsmart-tfstate-praneeth1116 2>/dev/null; then
            echo "Bucket does not exist. Creating..."
            aws s3api create-bucket --bucket shopsmart-tfstate-praneeth1116 --region $AWS_REGION --create-bucket-configuration LocationConstraint=$AWS_REGION
          else
            echo "Bucket already exists."
          fi

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
